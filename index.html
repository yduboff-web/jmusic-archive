<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search · Jewish Music Booklet Archive</title><link rel="stylesheet" href="shared.css"><div id="site-header"></div><main><script src="shared.js"></script><script src="roles.js"></script><label for="query">Search names, songs or albums</label><div class="controls"><input id="query" type="search" placeholder="Search the archive" autocomplete="off"><select id="role" aria-label="Credit role"><option value="">All credit roles</option><option value="composer">Composer</option><option value="lyricist">Lyricist</option><option value="arranger">Arranger</option><option value="soloist">Soloist / vocalist</option><option value="choir">Choir</option><option value="conductor">Conductor</option><option value="producer">Producer</option><option value="musicians">Musicians</option></select><select id="status" aria-label="Review status"><option value="">All review statuses</option><option value="reviewed">Reviewed</option><option value="pending">Awaiting review</option></select></div><p id="resultCount" aria-live="polite"></p><div id="results" class="grid"></div><button id="more" hidden>Show more</button><p id="error" role="alert"></p></main><script>
let db,limit=40;
let matchQ,matchVariants;
// A query that exactly matches a name in the identity index also matches that name's confirmed variants.
function match(h,q){
  if(matchQ!==q){
    const g=(db.identity_index||[]).find(e=>[e.name,...(e.variants||[])].some(n=>norm(n)===q));
    matchQ=q;
    matchVariants=(g?[g.name,...(g.variants||[])].map(norm):[q]).map(v=>v.split(' '));
  }
  return matchVariants.some(ts=>ts.every(t=>h.includes(t)));
}
const nameText=c=>[c.name_printed,c.name_resolved,...(c.name_search_aliases||[])].filter(Boolean).join(' ');

function render(){
  if(!db)return;
  const q=norm($('query').value),role=$('role').value,status=$('status').value;
  const songs=[],albums=[];
  for(const a of db.albums){
    if(status&&status!==a.review_status)continue;
    // Match on what the booklet prints. The Drive folder name is left out on purpose.
    const ah=[albumTitle(a),a.title_he,a.artist_printed,...(a.aliases||[]).map(x=>stripFolder(a,x))].filter(Boolean).join(' ');
    for(const t of a.tracks){
      const credits=role?t.credits.filter(c=>inGroup(c.role,role)):t.credits;
      if(role&&!credits.length)continue;
      // With a role chosen, the name has to be on a credit in that role.
      const hit=role
        ?credits.some(c=>match(norm(nameText(c)),q))
        :match(norm([ah,t.title_en,t.title_he,t.text_source,t.composition_attribution_printed,...credits.map(c=>nameText(c)+' '+(c.segment||''))].filter(Boolean).join(' ')),q);
      if(hit)songs.push({a,t,credits});
    }
    const ac=a.album_credits||[];
    if(q&&ac.length){
      const hit=role
        ?ac.some(c=>inGroup(c.role,role)&&match(norm(nameText(c)),q))
        :match(norm(ah+' '+ac.map(c=>(c.name_printed||'')+' '+(c.role_printed||'')).join(' ')),q);
      if(hit)albums.push({a});
    }
  }
  const rows=[...songs,...albums];
  const n=songs.length,m=albums.length;
  $('resultCount').textContent=n
    ?n+' reviewed song result'+(n===1?'':'s')+(m?' · '+m+' album-wide credit'+(m===1?'':'s'):'')
    :m+' album-wide credit result'+(m===1?'':'s');
  $('results').innerHTML=rows.slice(0,limit).map(r=>r.t?songCard(r):albumCard(r)).join('');
  if(!rows.length)$('results').innerHTML='<p>No results in the current reviewed data. <a href="booklets.html">Browse all booklets</a> to search the source inventory.</p>';
  $('more').hidden=rows.length<=limit;
}

function songCard({a,t,credits}){
  const artist=a.artist_printed||(a.review_status==='reviewed'?'Artist not printed':a.artist_folder);
  const num=(t.tape?esc(t.tape)+' · ':'')+(t.side?esc(t.side)+' · ':'')+(t.number!=null?esc(t.number)+'. ':'');
  const credit=c=>`<div class="credit"><span>${esc(c.role)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}${c.note?`<small> · ${esc(c.note)}</small>`:''}${c.segment?`<small class="bidi"> · ${esc(c.segment)}</small>`:''}${c.credit_basis?`<small> · ${esc(c.credit_basis)} · PDF page ${esc(c.source.page)}</small>`:''}${c.album_wide_source?`<small> · Also album-wide · PDF page ${esc(c.album_wide_source.page)}</small>`:''}${c.overlap_notice?`<small> · ${esc(c.overlap_notice)}</small>`:''}</span><span class="bidi">${esc(c.name_printed)}${c.source&&c.source.page!==t.source_page?`<small> · PDF page ${esc(c.source.page)}</small>`:''}</span></div>`;
  return `<article><span class="badge reviewed">Reviewed song credits</span>`
    +`<p class="muted bidi">${esc(artist)} · ${esc(albumTitle(a))}${a.edition_label?' · '+esc(a.edition_label):''}</p>`
    +`<h2 class="bidi">${num}${esc(t.title_en||t.title_he)}</h2>`
    +(t.title_en&&t.title_he?`<p class="bidi">${esc(t.title_he)}</p>`:'')
    +(credits.length?credits.map(credit).join(''):'<p class="muted">No confirmed per-song person credits entered. See the booklet and album-wide credits.</p>')
    +`<p>${bookletLink(a,t.source_page)}</p>`
    +(t.text_source?`<p class="muted bidi">Text source: ${esc(t.text_source)}</p>`:'')
    +(t.composition_attribution_printed?`<p class="muted bidi">Composition attribution: ${esc(t.composition_attribution_printed)}</p>`:'')
    +(t.notes?`<p class="muted">${esc(typeof t.notes==='string'?t.notes:t.notes.join(' '))}</p>`:'')
    +`</article>`;
}

function albumCard({a}){
  const ok=a.review_status==='reviewed';
  return `<article><span class="badge ${ok?'reviewed':''}">Album-wide credit${ok?'':' · track credits awaiting review'}</span>`
    +`<p class="muted bidi">${esc(a.artist_printed||'Artist not printed')}</p>`
    +`<h2 class="bidi">${esc(albumTitle(a))}</h2>`
    +(a.edition_label?`<p>${esc(a.edition_label)}</p>`:'')
    +(a.title_he&&a.title_he!==albumTitle(a)?`<p class="bidi">${esc(a.title_he)}</p>`:'')
    +`<p>${bookletLink(a)}</p>`
    +`<details><summary>Album-wide credits (composer scope shown in song results)</summary>${a.album_credits.map(c=>`<div class="credit"><span>${esc(c.role)}</span><span class="bidi">${esc(c.name_printed)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}</span></div>`).join('')}</details>`
    +(a.sources.length>1?`<details><summary>${a.sources.length} ${a.duplicate_kind==='same-edition rescan'?'same-edition scans':'page-identical source copies'}</summary>${a.sources.map(s=>`<p class="bidi">${esc(s.filename)}</p>`).join('')}</details>`:'')
    +`</article>`;
}

let timer;
function update(){
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    limit=40;
    if(!norm($('query').value)){$('results').innerHTML='';$('resultCount').textContent='';$('more').hidden=true;return}
    try{db=await loadDB();render()}catch(e){}
  },180);
}
for(const id of ['query','role','status'])$(id).oninput=update;
$('more').onclick=()=>{limit+=40;render()};
const requested=new URLSearchParams(location.search).get('q');
if(requested){$('query').value=requested;update()}
</script></html>
