<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Music Booklet Archive</title><style>
:root{--bg:#0d0d14;--surface:#16161f;--border:#2a2a3a;--gold:#c9a84c;--cream:#f0e8d5;--muted:#b1acc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Georgia,'Times New Roman',serif}header,main{max-width:1120px;margin:auto;padding:24px}header{border-bottom:1px solid var(--border)}h1{font-weight:400;color:var(--gold);font-size:32px;margin:8px 0}h2{font-size:24px;margin:0}p{margin:8px 0}.muted,small{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin:22px 0 12px}input,select,button{font:inherit;min-height:46px;border-radius:8px;border:1px solid var(--border);padding:10px;background:var(--surface);color:var(--cream);min-width:0}input:focus,select:focus,button:focus,a:focus{outline:2px solid var(--gold);outline-offset:3px}button{cursor:pointer}.tabs{display:flex;gap:8px;margin:16px 0}.active{border-color:var(--gold);color:var(--gold)}.note{padding:12px 16px;border-left:3px solid var(--gold);background:var(--surface);margin-top:16px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}article{padding:20px;border:1px solid var(--border);background:var(--surface);border-radius:10px;overflow-wrap:anywhere}a{color:var(--gold)}.badge{display:inline-block;font:12px/1.6 sans-serif;letter-spacing:.03em;border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin-bottom:12px}.reviewed{color:#9dd8b9}.credit{display:block;border-top:1px solid var(--border);padding:8px 0}.credit span:first-child{display:block;color:var(--muted)}.credit span:last-child{display:block;text-align:start}details{margin:12px 0}summary{min-height:44px;cursor:pointer}.bidi{unicode-bidi:plaintext}#more[hidden]{display:none}#more{display:block;margin:20px auto}.stat{display:flex;gap:20px;flex-wrap:wrap;font:14px/1.6 sans-serif}.stat strong{color:var(--gold)}footer{padding:24px;color:var(--muted);text-align:center}@media(max-width:650px){header,main{padding:20px}h1{font-size:27px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.controls select{grid-column:1/-1}.grid{grid-template-columns:1fr}.credit{display:block}.credit span{display:block}.credit span:last-child{text-align:start}article{padding:16px}.tabs button{flex:1}.stat{gap:8px 18px}}
nav{display:flex;justify-content:flex-end}.page-menu{position:relative;margin:0 0 24px;min-width:150px}.page-menu summary{border:1px solid var(--border);border-radius:8px;padding:10px 16px}.page-menu a{display:block;padding:12px 16px;min-height:46px;background:var(--surface);border-bottom:1px solid var(--border)}[hidden]{display:none!important}.about{max-width:720px}.about h2{margin-top:32px}#error{color:#f0a6a6}</style><header><p class="muted">ארכיון המוזיקה היהודית</p><h1>Jewish Music Booklet Archive</h1><p>One database. Albums, songs and the people behind them.</p></header><main><nav aria-label="Archive pages"><details class="page-menu"><summary>Pages</summary><a href="rebuild.html">Search</a><a href="booklets.html">All booklets</a><a href="2-people.html">Index</a><a href="about.html">About the archive</a></details></nav><h2>All booklets</h2><label for="query">Filter the source inventory</label><div class="controls"><input id="query" type="search" placeholder="Search the archive" autocomplete="off"><select id="role" aria-label="Credit role" hidden><option value="">All credit roles</option><option>composer</option><option>lyricist</option><option>text author</option><option>possible text author</option><option>arranger</option><option>production</option><option>mixer</option><option>choir</option><option>background vocals</option><option>choir arranger</option></select><select id="status" aria-label="Review status"><option value="">All review statuses</option><option value="reviewed">Reviewed</option><option value="pending">Awaiting review</option></select></div><p id="resultCount" aria-live="polite"></p><div id="results" class="grid"></div><button id="more" hidden>Show more</button><p id="error" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let db,mode='albums',limit=40;const norm=s=>String(s||'').normalize('NFKD').replace(/[\u0591-\u05c7]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function match(h,q){return q.split(' ').every(t=>h.includes(t))}function source(a,page){let s=a.sources[0];let u=new URL(s.url);u.searchParams.delete('authuser');return `<a href="${esc(u.href)}" target="_blank" rel="noopener">Open original booklet${page?' · PDF page '+page:''}</a>`}function render(){if(!db)return;const q=norm($('query').value),role=$('role').value,status=$('status').value;let rows=[];for(const a of db.albums){if(status&&status!==a.review_status)continue;const ah=norm([a.title,a.title_he,a.artist_printed,a.artist_folder,...a.aliases].join(' '));if(mode==='albums'){if(match(norm(ah+' '+(a.album_credits||[]).map(c=>c.name_printed+' '+(c.role_printed||'')).join(' ')),q))rows.push({a});continue}for(const t of a.tracks){let credits=t.credits.filter(c=>!role||c.role===role);if(role&&!credits.length)continue;const h=norm(ah+' '+t.title_en+' '+t.title_he+' '+(t.text_source||'')+' '+(t.composition_attribution_printed||'')+' '+credits.map(c=>c.name_printed+' '+(c.name_resolved||'')+' '+(c.name_search_aliases||[]).join(' ')+' '+(c.segment||'')).join(' '));if(match(h,q))rows.push({a,t,credits})}}
$('resultCount').textContent=rows.length+(mode==='credits'?' reviewed song result'+(rows.length===1?'':'s'):' booklet group'+(rows.length===1?'':'s'));$('results').innerHTML=rows.slice(0,limit).map(({a,t,credits})=>t?`<article><span class="badge reviewed">Reviewed song credits</span><p class="muted bidi">${esc(a.artist_printed||(a.review_status==='reviewed'?'Artist not printed':a.artist_folder))} · ${esc(a.title)}${a.edition_label?' · '+esc(a.edition_label):''}</p><h2 class="bidi">${t.tape?esc(t.tape)+' · ':''}${t.side?esc(t.side)+' · ':''}${t.number!=null?esc(t.number)+'. ':''}${esc(t.title_en||t.title_he)}</h2><p class="bidi">${esc(t.title_en?t.title_he:'')}</p>${!credits.length?'<p class="muted">No confirmed per-song person credits entered. See the booklet and album-wide credits.</p>':''}${credits.map(c=>`<div class="credit"><span>${esc(c.role)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}${c.note?`<small> · ${esc(c.note)}</small>`:''}${c.segment?`<small class="bidi"> · ${esc(c.segment)}</small>`:''}${c.credit_basis?`<small> · ${esc(c.credit_basis)} · PDF page ${esc(c.source.page)}</small>`:''}${c.album_wide_source?`<small> · Also album-wide · PDF page ${esc(c.album_wide_source.page)}</small>`:''}${c.overlap_notice?`<small> · ${esc(c.overlap_notice)}</small>`:''}</span><span class="bidi">${esc(c.name_printed)}${c.source&&c.source.page!==t.source_page?`<small> · PDF page ${esc(c.source.page)}</small>`:''}</span></div>`).join('')}<p>${source(a,t.source_page)}</p>${t.text_source?`<p class="muted bidi">Text source: ${esc(t.text_source)}</p>`:''}${t.composition_attribution_printed?`<p class="muted bidi">Composition attribution: ${esc(t.composition_attribution_printed)}</p>`:''}${t.notes?`<p class="muted">${esc(typeof t.notes==='string'?t.notes:t.notes.join(' '))}</p>`:''}</article>`:`<article><span class="badge ${a.review_status==='reviewed'?'reviewed':''}">${a.review_status==='reviewed'?'Track credits reviewed':'Track credits awaiting review'}</span><p class="muted bidi">${esc(a.artist_folder)}</p><h2 class="bidi">${esc(a.title)}</h2>${a.edition_label?`<p>${esc(a.edition_label)}</p>`:''}${a.title_he?`<p class="bidi">${esc(a.title_he)}</p>`:''}<p>${source(a)}</p>${(a.album_credits||[]).length?`<details><summary>Album-wide credits (composer scope shown in song results)</summary>${a.album_credits.map(c=>`<div class="credit"><span>${esc(c.role)}</span><span class="bidi">${esc(c.name_printed)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}</span></div>`).join('')}</details>`:''}${a.sources.length>1?`<details><summary>${a.sources.length} ${a.duplicate_kind==='same-edition rescan'?'same-edition scans':'page-identical source copies'}</summary>${a.sources.map(s=>`<p class="bidi">${esc(s.filename)}</p>`).join('')}</details>`:''}</article>`).join('');if(!rows.length)$('results').innerHTML='<p>No results in the current reviewed data. <a href="booklets.html">Browse all booklets</a> to search the source inventory.</p>';$('more').hidden=rows.length<=limit;$('role').disabled=mode==='albums'}
let loading;async function load(){if(db)return db;if(loading)return loading;loading=fetch('1-database-v4479.json').then(r=>{if(!r.ok)throw Error('Database could not be loaded.');return r.json()}).then(async d=>{if(d.encoding==='gzip-base64'){const bytes=Uint8Array.from(atob(d.data),c=>c.charCodeAt(0));d=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}return d}).then(d=>{db=d;const reviewed=d.albums.filter(a=>a.review_status==='reviewed');if($('stats'))$('stats').innerHTML=`<span><strong>${d.source_pdf_count}</strong> source PDFs</span><span><strong>${d.album_group_count}</strong> booklet groups</span><span><strong>${reviewed.length}</strong> reviewed albums</span><span><strong>${reviewed.reduce((n,a)=>n+a.tracks.length,0)}</strong> reviewed tracks</span>`;return db}).catch(e=>{$('error').textContent=e.message;loading=null;throw e});return loading}
let timer;function update(){clearTimeout(timer);timer=setTimeout(async()=>{limit=40;if(mode==='credits'&&!norm($('query').value)){$('results').innerHTML='';$('resultCount').textContent='';$('more').hidden=true;return}try{await load();render()}catch(e){}},180)}
for(const id of ['query','role','status'])$(id).oninput=update;$('more').onclick=()=>{limit+=40;render()};
if(mode==='albums')load().then(render).catch(()=>{});

</script></html>
