<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Music Booklet Archive</title><link rel="stylesheet" href="shared.css"><div id="site-header"></div><main><script src="shared.js"></script><label for="query">Search names, songs or albums</label><div class="controls"><input id="query" type="search" placeholder="Search the archive" autocomplete="off"><select id="role" aria-label="Credit role"><option value="">All credit roles</option><option>composer</option><option>lyricist</option><option>text author</option><option>possible text author</option><option>arranger</option><option>production</option><option>mixer</option><option>choir</option><option>background vocals</option><option>choir arranger</option></select><select id="status" aria-label="Review status"><option value="">All review statuses</option><option value="reviewed">Reviewed</option><option value="pending">Awaiting review</option></select></div><p id="resultCount" aria-live="polite"></p><div id="results" class="grid"></div><button id="more" hidden>Show more</button><p id="error" role="alert"></p></main><script>let db,mode='credits',limit=40;const identityGroups=[["Moshe Laufer", "משה לאופר", "משה לאופר / Moshe Laufer", "משה לאופר / MOSHE LAUFER", "MOSHE LAUFER / משה לאופר"], ["Yossi Green", "יוסי גרין", "יוסי גרין / Yossi Green"], ["Avi Singolda", "אבי סינגולדה", "אבי סינגולדה / Avi Singolda", "AVI SINGOLDA / אבי סינגולדה", "AVI SINGOLDA (אבי סינגולדה)"], ["Benny Laufer", "בני לאופר", "בני לאופר / Benny Laufer"]];function match(h,q){const g=identityGroups.find(v=>v.some(n=>norm(n)===q));return (g?g.map(norm):[q]).some(v=>v.split(' ').every(t=>h.includes(t)))}function source(a,page){let s=a.sources[0];let u=new URL(s.url);u.searchParams.delete('authuser');return `<a href="${esc(u.href)}" target="_blank" rel="noopener">Open original booklet${page?' · PDF page '+page:''}</a>`}function render(){if(!db)return;const q=norm($('query').value),role=$('role').value,status=$('status').value;let rows=[];for(const a of db.albums){if(status&&status!==a.review_status)continue;const ah=norm([a.title,a.title_he,a.artist_printed,a.artist_folder,...a.aliases].join(' '));if(mode==='albums'){if(match(norm(ah+' '+(a.album_credits||[]).map(c=>c.name_printed+' '+(c.role_printed||'')).join(' ')),q))rows.push({a});continue}for(const t of a.tracks){let credits=t.credits.filter(c=>!role||c.role===role);if(role&&!credits.length)continue;const h=norm(ah+' '+t.title_en+' '+t.title_he+' '+(t.text_source||'')+' '+(t.composition_attribution_printed||'')+' '+credits.map(c=>c.name_printed+' '+(c.name_resolved||'')+' '+(c.name_search_aliases||[]).join(' ')+' '+(c.segment||'')).join(' '));if(match(h,q))rows.push({a,t,credits})}}$('resultCount').textContent=rows.length+(mode==='credits'?' reviewed song result'+(rows.length===1?'':'s'):' booklet group'+(rows.length===1?'':'s'));$('results').innerHTML=rows.slice(0,limit).map(({a,t,credits})=>t?`<article><span class="badge reviewed">Reviewed song credits</span><p class="muted bidi">${esc(a.artist_printed||(a.review_status==='reviewed'?'Artist not printed':a.artist_folder))} · ${esc(a.title)}${a.edition_label?' · '+esc(a.edition_label):''}</p><h2 class="bidi">${t.tape?esc(t.tape)+' · ':''}${t.side?esc(t.side)+' · ':''}${t.number!=null?esc(t.number)+'. ':''}${esc(t.title_en||t.title_he)}</h2><p class="bidi">${esc(t.title_en?t.title_he:'')}</p>${!credits.length?'<p class="muted">No confirmed per-song person credits entered. See the booklet and album-wide credits.</p>':''}${credits.map(c=>`<div class="credit"><span>${esc(c.role)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}${c.note?`<small> · ${esc(c.note)}</small>`:''}${c.segment?`<small class="bidi"> · ${esc(c.segment)}</small>`:''}${c.credit_basis?`<small> · ${esc(c.credit_basis)} · PDF page ${esc(c.source.page)}</small>`:''}${c.album_wide_source?`<small> · Also album-wide · PDF page ${esc(c.album_wide_source.page)}</small>`:''}${c.overlap_notice?`<small> · ${esc(c.overlap_notice)}</small>`:''}</span><span class="bidi">${esc(c.name_printed)}${c.source&&c.source.page!==t.source_page?`<small> · PDF page ${esc(c.source.page)}</small>`:''}</span></div>`).join('')}<p>${source(a,t.source_page)}</p>${t.text_source?`<p class="muted bidi">Text source: ${esc(t.text_source)}</p>`:''}${t.composition_attribution_printed?`<p class="muted bidi">Composition attribution: ${esc(t.composition_attribution_printed)}</p>`:''}${t.notes?`<p class="muted">${esc(typeof t.notes==='string'?t.notes:t.notes.join(' '))}</p>`:''}</article>`:`<article><span class="badge ${a.review_status==='reviewed'?'reviewed':''}">${a.review_status==='reviewed'?'Track credits reviewed':'Track credits awaiting review'}</span><p class="muted bidi">${esc(a.artist_folder)}</p><h2 class="bidi">${esc(a.title)}</h2>${a.edition_label?`<p>${esc(a.edition_label)}</p>`:''}${a.title_he?`<p class="bidi">${esc(a.title_he)}</p>`:''}<p>${source(a)}</p>${(a.album_credits||[]).length?`<details><summary>Album-wide credits (composer scope shown in song results)</summary>${a.album_credits.map(c=>`<div class="credit"><span>${esc(c.role)}</span><span class="bidi">${esc(c.name_printed)}${c.role_printed?`<small class="bidi"> · ${esc(c.role_printed)}</small>`:''}</span></div>`).join('')}</details>`:''}${a.sources.length>1?`<details><summary>${a.sources.length} ${a.duplicate_kind==='same-edition rescan'?'same-edition scans':'page-identical source copies'}</summary>${a.sources.map(s=>`<p class="bidi">${esc(s.filename)}</p>`).join('')}</details>`:''}</article>`).join('');if(!rows.length)$('results').innerHTML='<p>No results in the current reviewed data. <a href="booklets.html">Browse all booklets</a> to search the source inventory.</p>';$('more').hidden=rows.length<=limit;$('role').disabled=mode==='albums'}let timer;function update(){clearTimeout(timer);timer=setTimeout(async()=>{limit=40;if(mode==='credits'&&!norm($('query').value)){$('results').innerHTML='';$('resultCount').textContent='';$('more').hidden=true;return}try{db=await loadDB();render()}catch(e){}},180)}for(const id of ['query','role','status'])$(id).oninput=update;$('more').onclick=()=>{limit+=40;render()};if(mode==='albums')loadDB().then(d=>{db=d;render()}).catch(()=>{});const requested=new URLSearchParams(location.search).get('q');if(requested){$('query').value=requested;update()}</script></html>
